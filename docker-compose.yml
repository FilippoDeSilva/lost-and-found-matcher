version: '3.8'

services:
  # PostgreSQL Database Container
  postgres_db:
    image: postgres:16-alpine
    container_name: matcher_postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-found-lost}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-found-lost}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Next.js Application Container
  web_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: matcher_nextjs_app
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NODE_ENV=production
    depends_on:
      postgres_db:
        condition: service_healthy

volumes:
  postgres_data:
